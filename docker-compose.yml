version: '3.8'

services:
  postgres:
    image: postgres:14.19-alpine
    container_name: sailpoint-postgres
    environment:
      POSTGRES_DB: sailpoint_poc
      POSTGRES_USER: sailpoint
      POSTGRES_PASSWORD: sailpoint123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailpoint"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-sailpoint:
    image: mockserver/mockserver:5.15.0
    container_name: mock-sailpoint
    ports:
      - "9090:1080"
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    volumes:
      - ./mockserver-expectations.json:/config/expectations.json:ro

volumes:
  postgres_data:
