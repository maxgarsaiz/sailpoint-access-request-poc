spring:
  application:
    name: sailpoint-access-request-poc
  
  datasource:
    url: jdbc:postgresql://localhost:5432/sailpoint_poc
    username: sailpoint
    password: sailpoint123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  
  jooq:
    sql-dialect: POSTGRES

server:
  port: 8080

sailpoint:
  client:
    base-url: http://localhost:9090/sailpoint/api
    connect-timeout: 5000
    read-timeout: 10000
  pooling:
    # Maximum number of polling attempts before marking request as failed
    max-retries: 2
    # Interval between polling attempts in seconds (60s = 1 minute)
    retry-interval-seconds: 20
    # Initial delay before first polling attempt in seconds
    initial-delay-seconds: 30
    
logging:
  level:
    com.maxgarsaiz.sailpoint: DEBUG
    org.jobrunr: INFO
    org.jooq: DEBUG