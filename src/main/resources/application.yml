spring:
  application:
    name: sailpoint-access-request-poc
  
  datasource:
    url: jdbc:postgresql://localhost:5432/sailpoint_access_request
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true

# JobRunr Configuration
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 8
      poll-interval-in-seconds: 15
      delete-succeeded-jobs-after: 36h
      permanently-delete-deleted-jobs-after: 72h
    dashboard:
      enabled: true
      port: 8001
    database:
      type: sql

# Sailpoint Configuration
sailpoint:
  api:
    base-url: http://localhost:8080/sailpoint

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.sailpoint.accessrequest: DEBUG
    org.jobrunr: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.jooq: DEBUG
