spring:
  application:
    name: sailpoint-access-request-poc
  
  datasource:
    url: jdbc:postgresql://localhost:5432/sailpoint_poc
    username: sailpoint
    password: sailpoint123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  
  jooq:
    sql-dialect: POSTGRES

server:
  port: 8080

org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 4
      poll-interval-in-seconds: 15
      delete-succeeded-jobs-after: 36
      permanently-delete-deleted-jobs-after: 72
    dashboard:
      enabled: true
      port: 8080
    database:
      type: sql
      skip-create: false
    jobs:
      default-number-of-retries: 5
      retry-back-off-time-seed: 30

sailpoint:
  client:
    base-url: http://localhost:9090/sailpoint/api
    connect-timeout: 5000
    read-timeout: 10000
  
  pooling:
    lock-timeout-minutes: 10
    
logging:
  level:
    com.maxgarsaiz.sailpoint: DEBUG
    org.jobrunr: INFO
    org.jooq: DEBUG